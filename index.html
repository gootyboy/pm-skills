<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Agent SDLC Swarm — NYC Subway Visualizer Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- Header & View Switcher -->
  <header class="h-16 border-b border-slate-200/80 px-4 md:px-8 flex items-center justify-between shrink-0 bg-white/90 backdrop-blur-xl z-20 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-600 font-bold text-lg">
        ⚡
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-slate-900 flex items-center gap-2">
          <span>Multi-Agent Swarm Visualizer</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 font-mono font-semibold">Subway Variants</span>
        </h1>
        <p class="text-[11px] text-slate-500 font-mono">/Volumes/Samsung 990 1TB/hp/projects/pm-skills</p>
      </div>
    </div>

    <!-- NYC Subway Style Variants Switcher -->
    <nav class="flex items-center bg-slate-100 border border-slate-200 rounded-2xl p-1 gap-1 overflow-x-auto">
      <button id="tab_jagged_strip" onclick="switchView('jagged_strip')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm transition-all whitespace-nowrap">
        ⚡ Jagged Track Line
      </button>
      <button id="tab_led_strip" onclick="switchView('led_strip')" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        🚇 Straight Strip (Angled 45°)
      </button>
      <button id="tab_mta_system" onclick="switchView('mta_system')" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        🗺️ MTA System Trunk Map
      </button>
      <button id="tab_winding" onclick="switchView('winding')" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        🐍 Winding Route Map
      </button>
      <button id="tab_vertical" onclick="switchView('vertical')" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        📊 Vertical Pillar Strip
      </button>
      <button id="tab_junction" onclick="switchView('junction')" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        🔀 Metro Transfer Junction
      </button>
    </nav>
  </header>

  <!-- Main Viewport Area -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- VARIANT 1: Jagged Zig-Zag Track Line -->
    <div id="view_jagged_strip" class="flex-1 p-8 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="jaggedStripContainer" class="w-full"></div>
    </div>

    <!-- VARIANT 2: Straight LED Station Indicator Strip with Angled 45° Titles -->
    <div id="view_led_strip" class="hidden flex-1 p-8 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="ledStripAngledContainer" class="w-full"></div>
    </div>

    <!-- VARIANT 3: MTA System Trunk Map -->
    <div id="view_mta_system" class="hidden flex-1 p-6 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="mtaSystemContainer" class="w-full"></div>
    </div>

    <!-- VARIANT 4: Winding S-Curve Route Map -->
    <div id="view_winding" class="hidden flex-1 p-8 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="windingRouteContainer" class="w-full"></div>
    </div>

    <!-- VARIANT 5: Vertical Station Pillar Strip -->
    <div id="view_vertical" class="hidden flex-1 p-6 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="verticalPillarContainer" class="w-full"></div>
    </div>

    <!-- VARIANT 6: Metro Transfer Junction Grid -->
    <div id="view_junction" class="hidden flex-1 p-6 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="junctionTerminalContainer" class="w-full"></div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
