<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Agent SDLC Swarm — Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- Header & View Switcher -->
  <header class="h-16 border-b border-slate-200/80 px-4 md:px-8 flex items-center justify-between shrink-0 bg-white/90 backdrop-blur-xl z-20 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-600 font-bold text-lg">
        ⚡
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-slate-900 flex items-center gap-2">
          <span>Multi-Agent Swarm Visualizer</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 font-mono font-semibold">12 SDLC Steps</span>
        </h1>
        <p class="text-[11px] text-slate-500 font-mono">/Volumes/Samsung 990 1TB/hp/projects/pm-skills</p>
      </div>
    </div>

    <!-- UI/UX View Switcher Tabs -->
    <nav class="flex items-center bg-slate-100 border border-slate-200 rounded-2xl p-1 gap-1">
      <button id="tab_subway" onclick="switchView('subway')" class="px-4 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm transition-all">
        🚇 NYC Subway LED Strip
      </button>
      <button id="tab_pipeline" onclick="switchView('pipeline')" class="px-4 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors">
        📊 SDLC Pipeline Board
      </button>
    </nav>
  </header>

  <!-- Main Viewport Area (Clean Views Only - Zero Toolbars/Banners) -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- VIEW 1: Ultra-Clean Light-Theme NYC Subway LED Strip -->
    <div id="view_subway" class="flex-1 p-8 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="nycSubwayContainer" class="w-full"></div>
    </div>

    <!-- VIEW 2: SDLC Pipeline Board -->
    <div id="view_pipeline" class="hidden flex-1 flex overflow-x-auto p-6 bg-slate-50 gap-4">
      <div id="pipelineBoard" class="flex gap-3 w-full min-w-[1400px]"></div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
