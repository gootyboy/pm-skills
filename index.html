<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Agent SDLC Swarm — Standard SDLC Models Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- Header & View Switcher -->
  <header class="h-16 border-b border-slate-200/80 px-4 md:px-8 flex items-center justify-between shrink-0 bg-white/90 backdrop-blur-xl z-20 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-600 font-bold text-lg">
        📘
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-slate-900 flex items-center gap-2">
          <span>Multi-Agent SDLC Visualizer</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 font-mono font-semibold">Standard Textbook SDLC Models</span>
        </h1>
        <p class="text-[11px] text-slate-500 font-mono">/Volumes/Samsung 990 1TB/hp/projects/pm-skills</p>
      </div>
    </div>

    <!-- Textbook & Subway Diagram Models Switcher -->
    <nav class="flex items-center bg-slate-100 border border-slate-200 rounded-2xl p-1 gap-1 overflow-x-auto">
      <button id="tab_v_model" onclick="switchView('v_model')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm transition-all whitespace-nowrap">
        ✌️ V-Model (Pressman)
      </button>
      <button id="tab_double_diamond" onclick="switchView('double_diamond')" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        💎 Double Diamond (UX)
      </button>
      <button id="tab_devops_loop" onclick="switchView('devops_loop')" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        ♾️ DevOps Infinity Loop
      </button>
      <button id="tab_jagged_strip" onclick="switchView('jagged_strip')" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        ⚡ Jagged Track Line
      </button>
      <button id="tab_mta_system" onclick="switchView('mta_system')" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        🗺️ MTA System Trunk Map
      </button>
    </nav>
  </header>

  <!-- Main Viewport Area -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- MODEL 1: Pressman / Sommerville V-Model -->
    <div id="view_v_model" class="flex-1 p-6 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="vModelContainer" class="w-full"></div>
    </div>

    <!-- MODEL 2: Double Diamond Design & Delivery Model -->
    <div id="view_double_diamond" class="hidden flex-1 p-6 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="doubleDiamondContainer" class="w-full"></div>
    </div>

    <!-- MODEL 3: DevOps Continuous Infinity Loop -->
    <div id="view_devops_loop" class="hidden flex-1 p-6 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="devopsLoopContainer" class="w-full"></div>
    </div>

    <!-- MODEL 4: Jagged Zig-Zag Track Line -->
    <div id="view_jagged_strip" class="hidden flex-1 p-6 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="jaggedStripContainer" class="w-full"></div>
    </div>

    <!-- MODEL 5: MTA System Trunk Map -->
    <div id="view_mta_system" class="hidden flex-1 p-6 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="mtaSystemContainer" class="w-full"></div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
