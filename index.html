<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Agent SDLC Swarm — NYC Subway & Pipeline Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="h-16 border-b border-slate-200/80 px-4 md:px-8 flex items-center justify-between shrink-0 bg-white/90 backdrop-blur-xl z-20 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-600 font-bold text-lg">
        🚇
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-slate-900 flex items-center gap-2">
          <span>Multi-Agent Swarm Visualizer</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 font-mono font-semibold">NYC Subway & SDLC Pipeline</span>
        </h1>
        <p class="text-[11px] text-slate-500 font-mono">/Volumes/Samsung 990 1TB/hp/projects/pm-skills</p>
      </div>
    </div>

    <!-- UI/UX Layout Switcher Tabs -->
    <nav class="flex items-center bg-slate-100 border border-slate-200 rounded-2xl p-1 gap-1">
      <button id="tab_pipeline" onclick="switchView('pipeline')" class="px-4 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm transition-all">
        📊 SDLC Pipeline Board
      </button>
      <button id="tab_subway" onclick="switchView('subway')" class="px-4 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors">
        🚇 NYC Subway System Map
      </button>
    </nav>
  </header>

  <!-- Step Navigation Toolbar -->
  <div class="bg-white border-b border-slate-200 px-4 py-2 flex flex-wrap items-center justify-between gap-3 text-xs shrink-0 z-20 shadow-sm">
    <div class="flex items-center gap-2">
      <span class="font-bold text-slate-800 uppercase tracking-wider text-[11px]">📖 PROJECT_BUILDER Handoff Sequence:</span>
      <div class="flex items-center gap-1">
        <button onclick="prevStoryStep()" class="px-2.5 py-1 rounded-lg bg-slate-100 border border-slate-200 text-slate-700 hover:bg-slate-200 font-medium">⏮ Prev</button>
        <button onclick="nextStoryStep()" class="px-3 py-1 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold shadow-sm">Next Step ⏭</button>
        <button onclick="setStoryStep(0)" class="px-2.5 py-1 rounded-lg bg-slate-100 border border-slate-200 text-slate-600 hover:bg-slate-200 font-medium">Clear Focus</button>
      </div>

      <!-- Step Buttons (1-10) -->
      <div class="hidden lg:flex items-center gap-1 ml-2">
        <span class="text-slate-400 text-[11px] mr-1">Step:</span>
        <button id="storyBtn1" onclick="setStoryStep(1)" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs border border-slate-200 font-bold">1 (S)</button>
        <button id="storyBtn2" onclick="setStoryStep(2)" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs border border-slate-200 font-bold">2 (A)</button>
        <button id="storyBtn3" onclick="setStoryStep(3)" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs border border-slate-200 font-bold">3 (C)</button>
        <button id="storyBtn4" onclick="setStoryStep(4)" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs border border-slate-200 font-bold">4 (F)</button>
        <button id="storyBtn5" onclick="setStoryStep(5)" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs border border-slate-200 font-bold">5 (M)</button>
        <button id="storyBtn6" onclick="setStoryStep(6)" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs border border-slate-200 font-bold">6 (1)</button>
        <button id="storyBtn7" onclick="setStoryStep(7)" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs border border-slate-200 font-bold">7 (3)</button>
        <button id="storyBtn8" onclick="setStoryStep(8)" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs border border-slate-200 font-bold">8 (7)</button>
        <button id="storyBtn9" onclick="setStoryStep(9)" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs border border-slate-200 font-bold">9 (4)</button>
        <button id="storyBtn10" onclick="setStoryStep(10)" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs border border-slate-200 font-bold">10 (L)</button>
      </div>
    </div>
  </div>

  <!-- Story Banner -->
  <div id="storyBanner" class="hidden bg-blue-50/90 border-b border-blue-200 px-6 py-3 text-xs shrink-0 transition-all">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <div>
        <span class="text-blue-700 font-bold uppercase tracking-wider text-[10.5px]">📖 Active MTA Line Handoff</span>
        <h3 id="storyTitle" class="text-sm font-bold text-slate-900 mt-0.5">1. State: Orchestrator State Engine</h3>
        <p id="storyDesc" class="text-xs text-slate-600 mt-0.5 leading-relaxed font-normal"></p>
      </div>
      <button onclick="setStoryStep(0)" class="text-slate-400 hover:text-slate-700 font-bold px-2 py-1">✕</button>
    </div>
  </div>

  <!-- Main Viewport Area -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- VIEW 1: SDLC Pipeline Board -->
    <div id="view_pipeline" class="flex-1 flex overflow-x-auto p-6 bg-slate-50 gap-4">
      <div id="pipelineBoard" class="flex gap-3 w-full min-w-[1400px]"></div>
    </div>

    <!-- VIEW 2: Authentic NYC Subway (MTA) System Map -->
    <div id="view_subway" class="hidden flex-1 p-6 overflow-y-auto bg-[#f0eee6] flex items-center justify-center">
      <div id="nycSubwayContainer" class="w-full"></div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
