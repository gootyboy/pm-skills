<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Agent SDLC Swarm — Outside-the-Box Visualizer Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="h-16 border-b border-slate-200/80 px-4 md:px-8 flex items-center justify-between shrink-0 bg-white/90 backdrop-blur-xl z-20 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-600 font-bold text-lg">
        ⚡
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-slate-900 flex items-center gap-2">
          <span>Multi-Agent Swarm Visualizer Suite</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 font-mono font-semibold">6 UI Layouts</span>
        </h1>
        <p class="text-[11px] text-slate-500 font-mono">/Volumes/Samsung 990 1TB/hp/projects/pm-skills</p>
      </div>
    </div>

    <!-- UI/UX Outside-the-Box View Switcher Tabs -->
    <nav class="flex items-center bg-slate-100 border border-slate-200 rounded-2xl p-1 gap-1 overflow-x-auto">
      <button id="tab_pipeline" onclick="switchView('pipeline')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm transition-all whitespace-nowrap">
        📊 SDLC Pipeline
      </button>
      <button id="tab_mission" onclick="switchView('mission')" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        🚀 Mission Control
      </button>
      <button id="tab_pcb" onclick="switchView('pcb')" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        ⚡ PCB Circuit
      </button>
      <button id="tab_filmstrip" onclick="switchView('filmstrip')" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        🎬 Keynote Filmstrip
      </button>
      <button id="tab_radar" onclick="switchView('radar')" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        🗺️ Tactical Radar
      </button>
      <button id="tab_metro" onclick="switchView('metro')" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap">
        🌳 Metro Tube Map
      </button>
    </nav>
  </header>

  <!-- Story Banner -->
  <div id="storyBanner" class="hidden bg-blue-50/90 border-b border-blue-200 px-6 py-3 text-xs shrink-0 transition-all">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <div>
        <span class="text-blue-700 font-bold uppercase tracking-wider text-[10.5px]">📖 Active PROJECT_BUILDER Handoff Step</span>
        <h3 id="storyTitle" class="text-sm font-bold text-slate-900 mt-0.5">1. State: Orchestrator State Engine</h3>
        <p id="storyDesc" class="text-xs text-slate-600 mt-0.5 leading-relaxed font-normal"></p>
      </div>
      <button onclick="setStoryStep(0)" class="text-slate-400 hover:text-slate-700 font-bold px-2 py-1">✕</button>
    </div>
  </div>

  <!-- Main Viewport Area -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- VIEW 1: SDLC Pipeline Board -->
    <div id="view_pipeline" class="flex-1 flex overflow-x-auto p-6 bg-slate-50 gap-4">
      <div id="pipelineBoard" class="flex gap-3 w-full min-w-[1400px]"></div>
    </div>

    <!-- VIEW 2: Mission Control Console -->
    <div id="view_mission" class="hidden flex-1 p-6 overflow-y-auto bg-slate-950 flex items-center justify-center">
      <div id="missionControlContainer" class="w-full"></div>
    </div>

    <!-- VIEW 3: PCB Circuit Board -->
    <div id="view_pcb" class="hidden flex-1 p-6 overflow-y-auto bg-[#07130c] flex items-center justify-center">
      <div id="pcbCircuitContainer" class="w-full"></div>
    </div>

    <!-- VIEW 4: Keynote Filmstrip Timeline -->
    <div id="view_filmstrip" class="hidden flex-1 p-6 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="filmstripContainer" class="w-full"></div>
    </div>

    <!-- VIEW 5: Tactical Radar Map -->
    <div id="view_radar" class="hidden flex-1 p-6 overflow-y-auto bg-slate-950 flex items-center justify-center">
      <div id="radarMapContainer" class="w-full"></div>
    </div>

    <!-- VIEW 6: Metro Transit Tube Map -->
    <div id="view_metro" class="hidden flex-1 p-6 overflow-y-auto bg-slate-50 flex items-center justify-center">
      <div id="metroTransitContainer" class="w-full"></div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
